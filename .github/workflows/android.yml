
name: Build NIGHTLINK debug APK

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightlink-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: "35.0.0"
  EXPECTED_DEBUG_APP_ID: "com.nightlink.app.debug"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            project_dir="."
          else
            mapfile -t zips < <(find . -maxdepth 1 -type f -iname "*.zip" | sort)

            if [ "${#zips[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one source ZIP."
              printf '%s\n' "${zips[@]}"
              exit 1
            fi

            mkdir -p extracted
            unzip -q "${zips[0]}" -d extracted

            settings_file="$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/__MACOSX/*' \
              | awk '{ print gsub("/","/"), $0 }' \
              | sort -n | sed -n '1p' | cut -d' ' -f2-)"

            if [ -z "$settings_file" ]; then
              echo "::error::No Gradle project found inside ZIP."
              exit 1
            fi

            project_dir="$(dirname "$settings_file")"
          fi

          echo "Using project: $project_dir"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

          if [ -f "$project_dir/gradlew" ] && \
             [ -f "$project_dir/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "has_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.has_wrapper == 'true' && 'wrapper' || '8.9' }}

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          HAS_WRAPPER: ${{ steps.project.outputs.has_wrapper }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ "$HAS_WRAPPER" = "true" ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK and prepare artifact
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)

          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one debug APK, found ${#apks[@]}"
            ls -la app/build/outputs/apk/debug || true
            exit 1
          fi

          apk="${apks[0]}"
          bt="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"

          fail() {
            echo "::error::$1"
            exit 1
          }

          echo "APK: $apk"

          # APK-Metadaten auslesen
          if [ -x "$bt/aapt" ]; then
            badging="$("$bt/aapt" dump badging "$apk")"
          else
            badging="$("$bt/aapt2" dump badging "$apk")"
          fi

          echo "$badging"

          app_id="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<<"$badging" | head -n1)"
          vcode="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<<"$badging" | head -n1)"
          vname="$(sed -nE "s/.*versionName='([^']*)'.*/\1/p" <<<"$badging" | head -n1)"

          # minSdk zuerst aus aapt lesen
          min_sdk="$(sed -nE "s/^sdkVersion:'([0-9]+)'.*/\1/p" <<<"$badging" | head -n1)"

          # Falls aapt keinen Wert liefert, apkanalyzer verwenden
          if [ -z "$min_sdk" ]; then
            analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"

            if [ -x "$analyzer" ]; then
              min_sdk="$("$analyzer" manifest min-sdk "$apk" 2>/dev/null || true)"
            fi
          fi

          echo "applicationId=$app_id"
          echo "versionName=$vname"
          echo "versionCode=$vcode"
          echo "minSdk=$min_sdk"

          [ "$app_id" = "$EXPECTED_DEBUG_APP_ID" ] || \
            fail "Unexpected applicationId: $app_id"

          [[ "$app_id" == *.debug ]] || \
            fail "Debug APK must use an applicationId ending in .debug"

          [[ "$vname" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || \
            fail "Invalid versionName: $vname"

          expected_code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))

          [ "$vcode" = "$expected_code" ] || \
            fail "versionCode does not match versionName"

          [[ "$min_sdk" =~ ^[0-9]+$ ]] || \
            fail "Could not determine minSdk from APK"

          grep -q "^application-debuggable" <<<"$badging" || \
            fail "APK is not marked debuggable"

          grep -q "^targetSdkVersion:'35'" <<<"$badging" || \
            fail "targetSdk is not 35"

          if grep -q "uses-permission: name='android.permission.RECORD_AUDIO'" <<<"$badging"; then
            fail "Unexpected RECORD_AUDIO permission"
          fi

          # APK-Signatur prüfen
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt

          grep -q "^Verifies" apksigner.txt || \
            fail "APK signature verification failed"

          # Artifact vorbereiten
          mkdir -p dist

          name="NIGHTLINK-${vname}-debug.apk"
          cp "$apk" "dist/$name"

          (cd dist && sha256sum "$name" > "$name.sha256")

          {
            echo "### NIGHTLINK debug APK"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| File | \`$name\` |"
            echo "| Application ID | \`$app_id\` |"
            echo "| Version | \`$vname\` |"
            echo "| Version Code | \`$vcode\` |"
            echo "| Minimum SDK | \`$min_sdk\` |"
            echo "| Size | $(du -h "dist/$name" | cut -f1) |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "dist/$name.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTLINK-debug-APK
          path: ${{ steps.project.outputs.project_dir }}/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          HAS_WRAPPER: ${{ steps.project.outputs.has_wrapper }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ "$HAS_WRAPPER" = "true" ]; then
            ./gradlew --no-daemon --stacktrace testDebugUnitTest
          else
            gradle --no-daemon --stacktrace testDebugUnitTest
          fi

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTLINK-unit-test-reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/tests/testDebugUnitTest
            ${{ steps.project.outputs.project_dir }}/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
